server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip de alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Headers de Seguridad de Grado Militar (OWASP Standards)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Endpoint de Monitoreo / SRE Healthcheck
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Service Worker & Manifest: No cachear para garantizar despliegues continuos
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # HTML principal: revalidación inmediata
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Assets estáticos inmutables (Imágenes WebP, MP3, MP4): Cache agresivo de 1 año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Fallback SPA / Enrutamiento interno
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Página de error personalizada
    error_page 404 /index.html;
}
